name: astrbot_plugin_sponsor_pass
display_name: 陌生人准入·赞助直通
short_desc: 用已验证的爱发电赞助和商品订单自动兑换会员准入权益
desc: |
  将陌生人准入、爱发电赞助/商品订单核验和会员权益发放自动化。非白名单私聊先免费体验 N 轮，之后可等待管理员同意，或通过爱发电已支付订单自动兑换会员准入权益。

  支持普通赞助、售卖商品、数字内容、实体商品、捆绑包、订单号自助兑换、忘填QQ留言兜底、一次性订单核销、金额阶梯、方案/商品白名单、商品按份有效期、黑名单、限时会员、待审批队列、通知重试、自检和收入统计。

  自动放行必须经过爱发电 query-order API 精确核验，不接受任意数字、用户自述、昵称匹配或本地猜测。异常订单、争议订单和不完整字段会转人工处理。
version: 1.0.0
