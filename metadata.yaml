name: astrbot_plugin_sponsor_pass
display_name: 陌生人准入·赞助直通
short_desc: 陌生人先聊N轮，之后等管理员同意或爱发电赞助自动通过
desc: |
  非白名单好友私聊先自由对话 N 轮（默认 6 轮，合并窗口内连发算同一轮），
  超过轮数后机器人给出两条路，并私聊通知管理员：

  ① **等待管理员同意**：管理员用 `/准入 同意 <QQ> [天数]` 放行（可限时）；

  ② **爱发电赞助直通**：对方去你的爱发电主页赞助并在留言备注 QQ，
  然后给机器人发「我赞助了」，插件调用爱发电开放接口校验订单
  （状态=交易成功、实付金额达标、留言含对方QQ），通过后自动放行
  （可设有效期，到期自动出列并提示续期），并私聊通知管理员。

  管理命令（仅管理员）：
  `/准入 同意 <QQ> [天数]` | `/准入 移除 <QQ>` | `/准入 拉黑 <QQ>` | `/准入 解黑 <QQ>` |
  `/准入 状态 <QQ>` | `/准入 重置 <QQ>` | `/准入 统计` | `/准入 列表`

  特性：轮次按对话轮计数（合并窗口内连发算一轮）；状态持久化（重启不清零）；
  拦截期每天仅提醒一次；赞助校验限频防刷；黑名单永久拦截；
  AstrBot 管理员自动豁免；好友申请/通知事件独立放行（与人际关系等插件兼容）；
  未配置爱发电时只提示等待同意，不会给出无效入口；仅处理私聊，不影响群聊。
