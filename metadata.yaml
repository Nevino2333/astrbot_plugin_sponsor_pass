name: astrbot_plugin_sponsor_pass
display_name: 陌生人准入·赞助直通
short_desc: 陌生人先聊N轮，之后等管理员同意或爱发电赞助自动通过
desc: |
  非白名单好友私聊先自由对话 N 轮（默认 6 轮，合并窗口内连发算同一轮），
  超过轮数后机器人给出两条路：

  ① **等待管理员同意**：管理员用 `/准入 同意 <QQ>` 放行；

  ② **爱发电赞助直通**：对方去你的爱发电主页赞助并在留言备注 QQ，
  然后给机器人发「我赞助了」，插件调用爱发电开放接口校验订单
  （状态=交易成功、实付金额达标、留言含对方QQ），通过后自动加入白名单并私聊通知管理员。

  管理命令（仅管理员）：`/准入 同意 <QQ>` | `/准入 移除 <QQ>` | `/准入 列表`。

  特性：轮次按对话轮计数（180 秒合并窗口内连发算一轮）；拦截期每天仅提醒一次；
  同一人赞助校验限频防刷；未配置爱发电时只提示等待同意，不会给出无效入口；
  仅处理好友私聊，不影响群聊。
version: 0.1.0
author: Nevino
